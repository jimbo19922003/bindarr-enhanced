name: Validate independent artwork and catalogue source repair
on:
  push:
    branches: ['feat/setup-card-catalogue']
    paths:
      - 'scripts/repair-artwork-catalogue.py'
      - 'scripts/publish-catalogue.py'
      - 'backend/test/artworkCatalogueIndependence.test.js'
      - '.github/workflows/repair-artwork-catalogue.yml'
permissions:
  contents: write
concurrency:
  group: artwork-catalogue-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the reviewed source changes
        run: |
          python3 scripts/repair-artwork-catalogue.py
          git diff > /tmp/repair-first.diff
          python3 scripts/repair-artwork-catalogue.py
          git diff > /tmp/repair-second.diff
          cmp /tmp/repair-first.diff /tmp/repair-second.diff
          git diff --check
          python3 -m py_compile scripts/publish-catalogue.py
      - run: npm ci --prefix backend
      - run: node --test backend/test/artworkCatalogueIndependence.test.js backend/test/catalogueSetup.test.js
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit only after all application validation passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/routes/artworkRepair.js backend/src/utils/artworkRepairService.js backend/src/routes/catalogueSetup.js frontend/src/components/SetupCardCatalogue.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: activate independent artwork recovery and catalogue source diagnostics'
            git push origin HEAD:feat/setup-card-catalogue
          fi
