name: Apply and validate shared sales workflow
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-sales-ui.yml'
      - 'scripts/apply-sales-ui.py'
      - 'backend/src/utils/salesApplication*'
      - 'backend/src/routes/sales.js'
      - 'frontend/src/components/SalesPanel*'
      - 'frontend/src/components/RealizedGainCard.jsx'
permissions:
  contents: write
concurrency:
  group: apply-sales-ui
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded API and dashboard wiring
        run: |
          python3 scripts/apply-sales-ui.py
          python3 scripts/apply-sales-ui.py
          node --check backend/src/server.js
          node --check backend/src/utils/salesApplication.js
          node --check backend/src/routes/sales.js
      - name: Install isolated API test dependencies
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1 express@4.19.2
      - name: Test existing accounting and real sales confirmation flow
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js backend/src/utils/sp500Benchmark.test.js backend/src/utils/sealedSalesRepository.test.js backend/src/utils/salesInventoryProtection.test.js backend/src/utils/salesApplication.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated sales activation
        run: |
          git add backend/src/server.js backend/src/utils/sealedSalesRepository.js frontend/src/components/Dashboard.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: activate reviewed card and sealed sales in Executive dashboard'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
