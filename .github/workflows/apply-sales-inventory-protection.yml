name: Apply and validate sales inventory protection
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-sales-inventory-protection.yml'
      - 'scripts/apply-sales-inventory-protection.py'
      - 'backend/src/utils/salesInventoryProtection*'
permissions:
  contents: write
concurrency:
  group: apply-sales-inventory-protection
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact transaction and edit protections
        run: |
          python3 scripts/apply-sales-inventory-protection.py
          python3 scripts/apply-sales-inventory-protection.py
          node --check backend/src/routes/sealed.js
          node --check backend/src/utils/salesRepository.js
          node --check backend/src/utils/sealedSalesRepository.js
      - name: Install isolated SQLite dependency
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1
      - name: Run card sealed opening and guard regression tests
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js backend/src/utils/sp500Benchmark.test.js backend/src/utils/sealedSalesRepository.test.js backend/src/utils/salesInventoryProtection.test.js
      - name: Commit validated inventory protections
        run: |
          git add backend/src/routes/sealed.js backend/src/utils/salesRepository.js backend/src/utils/sealedSalesRepository.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect card and sealed inventory after recorded sales'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
