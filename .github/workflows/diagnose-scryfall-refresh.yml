name: Diagnose Scryfall background refresh
on:
  push:
    branches: ['release/pokemon-local-first']
    paths:
      - '.github/workflows/diagnose-scryfall-refresh.yml'
      - 'backend/test/e2e/trace-server.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scryfall-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_ADMIN_PASSWORD: test-admin-password
      BINDARR_DISABLE_TCGCSV_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix backend
      - name: Run unchanged Scryfall assertions with captured child-server diagnostics
        working-directory: backend
        run: node --require ./test/e2e/trace-server.cjs test/e2e/scryfall.test.js
