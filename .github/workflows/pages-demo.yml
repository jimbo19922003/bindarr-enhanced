name: Build demo and optionally deploy to GitHub Pages

# No Pages site is required for the self-hosted application.
# To publish the fixture-backed demo, enable Pages with Source: GitHub Actions
# and explicitly set the repository Actions variable ENABLE_PAGES_DEMO=true.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-demo.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo bundle without requiring Pages
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: |
          npm ci
          npm run build
      - name: Explain disabled optional publication
        if: vars.ENABLE_PAGES_DEMO != 'true' || github.ref != 'refs/heads/main'
        run: echo 'Demo build completed. Pages publication is skipped unless ENABLE_PAGES_DEMO=true on main. No Pages site is required for self-hosting.' >> "$GITHUB_STEP_SUMMARY"
      - name: Package explicitly enabled Pages deployment
        if: vars.ENABLE_PAGES_DEMO == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    if: vars.ENABLE_PAGES_DEMO == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the explicitly enabled Pages site
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
