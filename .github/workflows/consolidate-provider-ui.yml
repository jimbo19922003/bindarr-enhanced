name: Consolidate and validate provider credential UI
on:
  push:
    branches: ['release/pokemon-local-first']
    paths: ['scripts/consolidate-provider-ui.py', '.github/workflows/consolidate-provider-ui.yml']
permissions:
  contents: write
concurrency:
  group: consolidate-provider-ui
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.ref == 'refs/heads/release/pokemon-local-first' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed source-hash-guarded migration
        run: |
          python3 scripts/consolidate-provider-ui.py
          git diff > /tmp/provider-first.diff
          python3 scripts/consolidate-provider-ui.py
          git diff > /tmp/provider-second.diff
          cmp /tmp/provider-first.diff /tmp/provider-second.diff
          git diff --check
      - run: node --test scripts/test-provider-consolidation.mjs frontend/test/localCatalogOverview.test.mjs frontend/test/saveProviderKeys.test.mjs
      - run: npm ci --prefix backend
      - run: node --test backend/test/providerKeys.test.js backend/test/carddexKey.test.js
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit only the validated UI consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/AdminPanel.jsx frontend/src/components/Settings.jsx frontend/src/components/LocalCatalogStatusPanel.jsx frontend/src/components/SetupProviderKeys.jsx frontend/test/localCatalogOverview.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: activate unified Admin API key management'
          git push origin HEAD:release/pokemon-local-first
