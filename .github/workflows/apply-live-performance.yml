name: Apply and validate current-day portfolio freshness
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-live-performance.yml'
      - 'scripts/apply-live-performance.py'
      - 'backend/src/utils/livePerformance.js'
      - 'backend/src/utils/livePerformance.test.js'
permissions:
  contents: write
concurrency:
  group: apply-live-performance
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded edits
        run: |
          python3 scripts/apply-live-performance.py
          python3 scripts/apply-live-performance.py
          node --check backend/src/utils/livePerformance.js
          node --check backend/src/utils/performanceHistory.js
      - name: Install isolated SQLite test dependency
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1
      - name: Test accounting and current-day history
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated handler and chart edits
        run: |
          git add backend/src/utils/performanceHistory.js frontend/src/components/PerformanceChart.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: show fresh current-day portfolio value and invested cost'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
