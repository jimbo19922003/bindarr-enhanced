name: Validate manual Admin catalogue installation
on:
  push:
    branches: ['release/pokemon-local-first']
    paths:
      - '.github/workflows/wire-local-catalog-install.yml'
      - 'scripts/wire-local-catalog-install.py'
      - 'backend/src/utils/pokemonBundleInstall.js'
      - 'backend/src/routes/localCatalogInstall.js'
      - 'backend/test/pokemonBundleInstall.test.js'
      - 'frontend/src/components/LocalCatalogImportPanel.jsx'
permissions:
  contents: write
concurrency:
  group: wire-local-catalog-install
  cancel-in-progress: false
jobs:
  manual-install:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pokemon-local-first
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/wire-local-catalog-install.py
      - run: git diff --check
      - run: node --check backend/src/utils/pokemonBundleInstall.js
      - run: node --check backend/src/routes/localCatalogInstall.js
      - run: npm ci --prefix backend
      - run: node --test backend/test/pokemonBundleInstall.test.js backend/test/localCatalogStatus.test.js
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit validated import route and UI integration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/routes/localCatalogStatus.js frontend/src/components/LocalCatalogStatusPanel.jsx
          git commit -m 'feat: connect confirmed staged-bundle installation in Admin'
          git push origin HEAD:release/pokemon-local-first
