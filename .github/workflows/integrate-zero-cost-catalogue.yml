name: Integrate confirmed zero-cost acquisitions into catalogue branch
on:
  push:
    branches: ['feat/setup-card-catalogue']
    paths:
      - '.github/workflows/integrate-zero-cost-catalogue.yml'
permissions:
  contents: write
concurrency:
  group: zero-cost-catalogue-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the reviewed zero-cost files from pinned PR 17
        shell: bash
        run: |
          set -euo pipefail
          ZERO=0ce27e874ced47b061596a0181145dead5211157
          BASE=838e76e4a76b09c262c5d4c9ee1d8ea7b65ce50c
          git fetch --no-tags origin "$ZERO"
          test "$(git rev-parse FETCH_HEAD)" = "$ZERO"
          files=(backend/src/db.js backend/src/routes/collection.js backend/src/routes/sealedOpenings.js backend/src/utils/zeroCost.js backend/test/zeroCost.test.js backend/test/zeroCostOpening.test.js frontend/src/apiBase.js frontend/src/components/CardSearch.jsx frontend/src/utils/zeroCostConfirmation.mjs frontend/test/zeroCostConfirmation.test.mjs)
          git diff "$BASE" "$ZERO" -- "${files[@]}" > /tmp/confirmed-zero-cost.patch
          test -s /tmp/confirmed-zero-cost.patch
          if grep -q 'zero-cost-confirmation-v1' frontend/src/apiBase.js; then
            git apply --reverse --check /tmp/confirmed-zero-cost.patch
          else
            git apply --check /tmp/confirmed-zero-cost.patch
            git apply /tmp/confirmed-zero-cost.patch
          fi
          git diff --check
      - run: npm ci --prefix backend
      - run: node --test backend/test/zeroCost.test.js backend/test/zeroCostOpening.test.js frontend/test/zeroCostConfirmation.test.mjs backend/test/catalogBW8Correction.test.js backend/test/catalogLanguageScope.test.js
      - name: Recheck sealed-opening cost provenance
        run: node backend/test/sealedOpening.test.js
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit the integration only after application validation passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/db.js backend/src/routes/collection.js backend/src/routes/sealedOpenings.js backend/src/utils/zeroCost.js backend/test/zeroCost.test.js backend/test/zeroCostOpening.test.js frontend/src/apiBase.js frontend/src/components/CardSearch.jsx frontend/src/utils/zeroCostConfirmation.mjs frontend/test/zeroCostConfirmation.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: integrate confirmed zero-cost acquisitions on catalogue branch'
            git push origin HEAD:feat/setup-card-catalogue
          fi
