name: Apply and validate completed-rip sale basis
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-completed-rip-basis.yml'
      - 'scripts/apply-completed-rip-basis.py'
      - 'backend/src/utils/completedRipBasis*'
permissions:
  contents: write
concurrency:
  group: apply-completed-rip-basis
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded basis and review notice edits
        run: |
          python3 scripts/apply-completed-rip-basis.py
          python3 scripts/apply-completed-rip-basis.py
          node --check backend/src/utils/salesApplication.js
          node --check backend/src/utils/completedRipBasis.js
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1 express@4.19.2
      - name: Test accounting reporting and completed-rip sale flow
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js backend/src/utils/sp500Benchmark.test.js backend/src/utils/sealedSalesRepository.test.js backend/src/utils/salesInventoryProtection.test.js backend/src/utils/salesApplication.test.js backend/src/utils/salesReport.test.js backend/src/utils/completedRipBasis.test.js frontend/src/utils/saleTargets.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated completed-rip basis integration
        run: |
          git add backend/src/utils/openingBasisRepository.js backend/src/utils/salesApplication.js frontend/src/components/SaleDialogHost.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: derive and freeze completed rip basis when confirming a sale'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
