name: Apply and validate streamlined Executive dashboard
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-streamlined-dashboard.yml'
      - 'scripts/apply-streamlined-dashboard.py'
      - 'scripts/streamlined-dashboard/**'
permissions:
  contents: write
concurrency:
  group: apply-streamlined-dashboard
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded layout and labels
        run: |
          python3 scripts/apply-streamlined-dashboard.py
          python3 scripts/apply-streamlined-dashboard.py
          python3 -m json.tool frontend/src/locales/en.json > /dev/null
      - name: Install isolated SQLite test dependency
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1
      - name: Preserve accounting and benchmark behavior
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js backend/src/utils/sp500Benchmark.test.js frontend/src/utils/dashboardTimeline.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated frontend changes
        run: |
          git add frontend/src/components/Dashboard.jsx frontend/src/components/PerformanceChart.jsx frontend/src/components/BenchmarkComparison.jsx frontend/src/components/PerformanceChart.css frontend/src/locales/en.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: streamline Executive charts and loss-gain summary cards'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
