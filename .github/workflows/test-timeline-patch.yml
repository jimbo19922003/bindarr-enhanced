name: Apply test timeline patch
on:
  push:
    branches: [fix/dashboard-valuation-refresh]
    paths: ['.github/workflows/test-timeline-patch.yml', 'scripts/apply-timeline-patch.py', 'backend/src/utils/portfolioTimeline.js', 'backend/test/portfolioTimeline.test.js']
permissions:
  contents: write
concurrency:
  group: test-timeline-patch
  cancel-in-progress: false
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-valuation-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply-timeline-patch.py
      - run: node --check backend/src/routes/stats.js && node --test backend/test/portfolioTimeline.test.js
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npx --prefix frontend eslint frontend/src/components/Dashboard.jsx --max-warnings 0
      - run: npm run build --prefix frontend
      - name: Commit validated source patches to the test branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/Dashboard.jsx backend/src/routes/stats.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: record combined portfolio timeline and refresh after removals'
            git push origin HEAD:fix/dashboard-valuation-refresh
          fi
