name: Apply and validate opening sale integration
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-opening-sale-integration.yml'
      - 'scripts/apply-opening-sale-integration.py'
      - 'backend/src/utils/salesOpeningIntegration.js'
      - 'backend/src/utils/openingSaleIntegration.test.js'
permissions:
  contents: write
concurrency:
  group: apply-opening-sale-integration
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded accounting edits
        run: |
          python3 scripts/apply-opening-sale-integration.py
          python3 scripts/apply-opening-sale-integration.py
          node --check backend/src/utils/salesRepository.js
          node --check backend/src/utils/salesOpeningIntegration.js
      - name: Install isolated SQLite test dependency
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1
      - name: Test accounting and persistence
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js
      - name: Commit validated repository integration
        run: |
          git add backend/src/utils/salesRepository.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect frozen opening basis to acquisition lots and sales'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
