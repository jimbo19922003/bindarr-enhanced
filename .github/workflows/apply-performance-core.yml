name: Apply automatic performance tracking
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths: ['.github/workflows/apply-performance-core.yml', 'scripts/apply-performance-core.py', 'scripts/performance-core/**']
permissions:
  contents: write
concurrency:
  group: apply-performance-core
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/apply-performance-core.py
      - name: Validate SQL and JavaScript
        run: |
          python3 backend/test/investmentLedger.sql.test.py
          node --check backend/src/server.js
          node --check backend/src/utils/currentPortfolio.js
          node --check backend/src/utils/investmentLedger.js
          node --check backend/src/utils/dailyPerformance.js
          node --test backend/test/dailyPerformance.test.js
      - name: Commit validated backend changes
        run: |
          git add shared/investmentLedgerSchema.json backend/src/server.js backend/src/utils/currentPortfolio.js backend/src/utils/investmentLedger.js backend/src/utils/dailyPerformance.js backend/test/investmentLedger.sql.test.py backend/test/dailyPerformance.test.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: automatically audit investment records and retain daily performance'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
