name: Validate and connect browser artwork recovery
on:
  push:
    branches: ['release/pokemon-local-first']
    paths:
      - '.github/workflows/artwork-browser.yml'
      - 'scripts/wire-artwork-browser.py'
      - 'backend/src/utils/artworkRepairService.js'
      - 'backend/src/utils/orderedArtworkFallback.js'
      - 'backend/src/routes/artworkRepair.js'
      - 'backend/test/artworkRepairService.test.js'
      - 'frontend/src/utils/artworkRepairClient.mjs'
      - 'frontend/src/utils/useMissingArtwork.js'
      - 'frontend/test/artworkRepairClient.test.mjs'
permissions:
  contents: write
concurrency:
  group: browser-artwork-recovery
  cancel-in-progress: false
jobs:
  artwork-browser:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/wire-artwork-browser.py
      - name: Verify repeat-safe integration
        run: |
          git diff > /tmp/artwork-first.diff
          python3 scripts/wire-artwork-browser.py
          git diff > /tmp/artwork-second.diff
          cmp /tmp/artwork-first.diff /tmp/artwork-second.diff
          git diff --check
      - run: npm ci --prefix backend
      - run: node --test backend/test/pokemonArtworkRepair.test.js backend/test/carddexArtwork.test.js backend/test/artworkRepairService.test.js frontend/test/artworkRepairClient.test.mjs
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit tested browser and route wiring only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/routes/cardArt.js frontend/src/components/CardImage.jsx frontend/src/components/AddCards.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: connect administrator-triggered background artwork recovery'
          git push origin HEAD:release/pokemon-local-first
