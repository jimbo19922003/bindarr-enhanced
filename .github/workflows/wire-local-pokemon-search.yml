name: Validate local Pokemon search integration
on:
  push:
    branches: ['release/pokemon-local-first']
    paths:
      - '.github/workflows/wire-local-pokemon-search.yml'
      - 'scripts/wire-local-pokemon-search.py'
      - 'backend/src/utils/localPokemonSearch.js'
      - 'backend/test/localPokemonSearch.test.js'
permissions:
  contents: write
concurrency:
  group: wire-local-pokemon-search
  cancel-in-progress: false
jobs:
  local-search:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pokemon-local-first
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/wire-local-pokemon-search.py
      - run: git diff --check
      - run: node --check backend/src/routes/collection.js
      - run: npm ci --prefix backend
      - run: node --test backend/test/localPokemonSearch.test.js
      - run: npm test --prefix backend
      - name: Commit only validated route integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/routes/collection.js
          git commit -m 'feat: route opt-in Pokemon searches through local snapshots'
          git push origin HEAD:release/pokemon-local-first
