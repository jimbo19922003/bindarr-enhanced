name: Validate and connect language-aware catalogue setup
on:
  push:
    branches: ['feat/setup-card-catalogue']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: catalogue-setup-integration
  cancel-in-progress: false
jobs:
  catalogue-setup:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          python3 scripts/wire-catalogue-setup.py
          git diff > /tmp/catalogue-first.diff
          python3 scripts/wire-catalogue-setup.py
          git diff > /tmp/catalogue-second.diff
          cmp /tmp/catalogue-first.diff /tmp/catalogue-second.diff
          git diff --check
      - run: npm ci --prefix backend
      - run: node --test backend/test/catalogueSetup.test.js backend/src/utils/pokemonLocalCatalog.test.js backend/src/utils/pokemonCatalogBundle.test.js
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit only validated setup integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/SetupWizard.jsx frontend/src/components/LocalCatalogStatusPanel.jsx backend/src/routes/localCatalogStatus.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: connect catalogue language installation to setup and Admin'
            git push origin HEAD:feat/setup-card-catalogue
          fi
      - name: Open draft review without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --repo jimbo19922003/bindarr-enhanced --head feat/setup-card-catalogue --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo jimbo19922003/bindarr-enhanced --head feat/setup-card-catalogue --base main --draft --title "Setup: install verified card catalogues by language" --body "Adds catalogue installation in setup and Admin, using bounded downloads of validated TCGdex metadata release assets. Reuses installed languages and does not replace existing catalogues, collection records, prices or scanner indexes. The publishing workflow defaults to English and Japanese; other languages appear only when published. This remains a draft until the actual catalogue publication job and a live instance install are verified. Local-search routing is unchanged. No merge or deployment is performed."
          fi
