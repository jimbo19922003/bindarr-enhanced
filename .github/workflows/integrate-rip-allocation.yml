name: Validate and integrate rip allocation repair on main
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate-rip-allocation.py'
      - 'backend/src/utils/openingWeights.js'
      - 'backend/src/routes/openingBasisStatus.js'
      - 'backend/test/openingUnitAllocation.test.js'
      - 'backend/src/utils/openingBasisRepository.test.js'
      - 'frontend/src/components/OpeningBasisPanel.jsx'
      - '.github/workflows/integrate-rip-allocation.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: main-rip-allocation-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only reviewed allocation integration points
        run: |
          python3 scripts/integrate-rip-allocation.py
          git diff > /tmp/rip-first.diff
          python3 scripts/integrate-rip-allocation.py
          git diff > /tmp/rip-second.diff
          cmp /tmp/rip-first.diff /tmp/rip-second.diff
          git diff --check
      - run: npm ci --prefix backend
      - run: node --test backend/test/openingUnitAllocation.test.js backend/src/utils/completedRipBasis.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/timelineAccounting.test.js
      - run: node backend/test/sealedOpening.test.js
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit validated integration directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/utils/completedRipBasis.js backend/src/utils/openingBasisRepository.js backend/src/routes/openingEdit.js backend/src/routes/sealedOpenings.js frontend/src/components/CardInspectorModal.jsx frontend/src/components/RipForm.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: connect rip unit-value allocation and per-copy basis displays'
            git push origin HEAD:main
          fi
      - name: Request image validation and publication for integrated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-build.yml --repo jimbo19922003/bindarr-enhanced --ref main
