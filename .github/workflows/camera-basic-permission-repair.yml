name: Validate basic camera permission startup
on:
  push:
    branches: ['release/pokemon-local-first']
    paths:
      - '.github/workflows/camera-basic-permission-repair.yml'
      - 'scripts/fix-camera-basic-permission.py'
      - 'frontend/src/utils/cameraConstraints.test.js'
permissions:
  contents: write
concurrency:
  group: camera-basic-permission-repair
  cancel-in-progress: false
jobs:
  basic-camera:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pokemon-local-first
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/fix-camera-basic-permission.py
      - run: git diff --check
      - run: node --test frontend/src/utils/cameraConstraints.test.js
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Commit only validated camera constraint change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/CameraScanner.jsx
          git commit -m 'fix: avoid implicit zoom permission during camera startup'
          git push origin HEAD:release/pokemon-local-first
