name: Read remaining catalog build failure
on:
  push:
    branches: ['release/pokemon-local-first']
    paths: ['.github/workflows/release-catalog-diagnostics.yml']
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  diagnose:
    if: github.repository == 'jimbo19922003/bindarr-enhanced' && github.ref == 'refs/heads/release/pokemon-local-first'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read remaining failed build log
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view 42493574442 --repo jimbo19922003/bindarr-enhanced --log-failed > "$RUNNER_TEMP/catalog-failure.log"
      - name: Prepare bounded failure report
        run: |
          python3 <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          log=(root/'catalog-failure.log').read_text(errors='replace')
          excerpt=log[-35000:]
          fence='`'*max(3,max((len(m.group())+1 for m in re.finditer(r'`+',excerpt)),default=3))
          if len(fence)>100:
              excerpt=excerpt.replace('`',"'");fence='```'
          body='## Remaining catalog build failure: run 42493574442\n\nLast 35,000 characters of failed-job logs; excerpt may be truncated. Historical log retrieval only: no compilation, import or deployment.\n\n'+fence+'text\n'+excerpt+'\n'+fence+'\n'
          (root/'catalog-failure.md').write_text(body)
          PY
      - name: Post failed log to draft PR 13
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 13 --repo jimbo19922003/bindarr-enhanced --body-file "$RUNNER_TEMP/catalog-failure.md"
