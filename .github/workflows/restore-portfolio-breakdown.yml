name: Validate Portfolio Value subtitle cleanup
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - 'scripts/restore-portfolio-breakdown.py'
      - '.github/workflows/restore-portfolio-breakdown.yml'
permissions:
  contents: write
concurrency:
  group: restore-portfolio-breakdown
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply minimal guarded cleanup
        run: |
          python3 scripts/restore-portfolio-breakdown.py
          python3 scripts/restore-portfolio-breakdown.py
          node --test frontend/src/utils/dashboardTimeline.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated subtitle cleanup
        run: |
          git add frontend/src/components/Dashboard.jsx scripts/aligned-summary/summary.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: keep specific sealed-value breakdown on Portfolio Value card'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
