name: Apply and validate contextual selling and Sales History
on:
  push:
    branches: ['fix/rip-valuation-artwork-mixed-sets']
    paths:
      - '.github/workflows/apply-contextual-sales.yml'
      - 'scripts/apply-contextual-sales.py'
      - 'backend/src/utils/salesReport*'
      - 'frontend/src/components/SaleDialogHost.jsx'
      - 'frontend/src/components/SalesHistory.jsx'
      - 'frontend/src/components/SalesWorkflow.css'
      - 'frontend/src/utils/saleTargets*'
permissions:
  contents: write
concurrency:
  group: apply-contextual-sales
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jimbo19922003/bindarr-enhanced'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded contextual actions and navigation
        run: |
          python3 scripts/apply-contextual-sales.py
          python3 scripts/apply-contextual-sales.py
          node --check backend/src/utils/salesApplication.js
          node --check backend/src/utils/salesReport.js
          node --check backend/src/routes/sales.js
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/sales-deps" --no-audit --no-fund sqlite3@6.0.1 express@4.19.2
      - name: Test accounting transactions reporting and target identities
        env:
          NODE_PATH: ${{ runner.temp }}/sales-deps/node_modules
        run: node --test backend/src/utils/costBasis.test.js backend/src/utils/performanceHistory.test.js backend/src/utils/salesRepository.test.js backend/src/utils/openingBasisRepository.test.js backend/src/utils/openingSaleIntegration.test.js backend/src/utils/livePerformance.test.js backend/src/utils/sp500Benchmark.test.js backend/src/utils/sealedSalesRepository.test.js backend/src/utils/salesInventoryProtection.test.js backend/src/utils/salesApplication.test.js backend/src/utils/salesReport.test.js frontend/src/utils/saleTargets.test.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit validated contextual sale integration
        run: |
          git add frontend/src/App.jsx frontend/src/components/Dashboard.jsx frontend/src/components/RealizedGainCard.jsx frontend/src/components/CardInspectorModal.jsx frontend/src/components/SealedInventory.jsx backend/src/utils/salesApplication.js backend/src/routes/sales.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: sell from card details and sealed lots with separate Sales History reports'
          git push origin HEAD:refs/heads/fix/rip-valuation-artwork-mixed-sets
